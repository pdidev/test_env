spack:
  packages:
    all:
      target: [@TARGET@]
  definitions:
  - baselibs:
    - cmake
    - doxygen
    - pkgconf
    - py-numpy
    - python
  - baselibs_nocompiler:
    - py-pyyaml ~libyaml
    - py-setuptools
  - compiler: []
  - compilerpkg: []
  - mpi: []
  - optlibs: []
  concretizer:
    unify: when_possible
  specs:
  - matrix:
    - ['target=@TARGET@']
    - ['$%compiler']
    - - '$baselibs'
      - '$mpi'
      - '$optlibs'
  - matrix:
    - ['target=@TARGET@']
    - - '$compilerpkg'
      - '$baselibs_nocompiler'
